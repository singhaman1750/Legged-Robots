name: Rebuild website

# This repo is the single source of truth for the /resources/ section of
# singhaman1750.github.io. Whenever the content here changes, tell that repo to
# rebuild, so the website never has to be updated by hand.
#
# Requires a secret named WEBSITE_DISPATCH_TOKEN in this repo: a fine-grained
# personal access token scoped to singhaman1750/singhaman1750.github.io with
# "Contents: Read and write" permission.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "topics/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the website deploy
        run: |
          status=$(curl -sS -o /tmp/response -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/singhaman1750/singhaman1750.github.io/dispatches \
            -d '{"event_type":"content-updated"}')
          if [ "$status" = "204" ]; then
            echo "✅ Website rebuild triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Dispatch failed with HTTP $status:" >> $GITHUB_STEP_SUMMARY
            cat /tmp/response >> $GITHUB_STEP_SUMMARY
            echo "Check that the WEBSITE_DISPATCH_TOKEN secret exists and has not expired." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
